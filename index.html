<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日曆</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ====== 頂端導覽列 ====== -->
<header class="pd-header sticky-top">

  <!-- 主列：品牌｜日期導覽｜操作按鈕 -->
  <div class="pd-topbar">

    <!-- 品牌 -->
    <a class="pd-brand" href="#" id="brandHomeLink" title="返回日曆">
      <i class="fa-regular fa-calendar-days"></i>
      <span class="pd-brand-text">Payas Days</span>
      <em class="pd-brand-sub">日曆</em>
    </a>

    <!-- 中央：日期導覽 -->
    <div class="pd-date-nav">
      <button class="pd-arrow-btn" id="btnPrev" title="上一段（←）" aria-label="上一段">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <button class="pd-date-display" id="btnToday" title="點擊前往今天" aria-label="前往今天">
        <span id="navDateDisplay">載入中…</span>
      </button>
      <button class="pd-arrow-btn" id="btnNext" title="下一段（→）" aria-label="下一段">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <!-- 右側操作 -->
    <div class="pd-topbar-actions">
      <!-- 切換搜尋 -->
      <button class="pd-action-btn" id="btnSearch" title="搜尋事件（/）" aria-label="搜尋事件">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>

      <!-- 切換主題 -->
      <button class="pd-action-btn pd-theme-btn" id="btnTheme" title="切換深色／淺色模式" aria-label="切換佈景主題">
        <span class="pd-theme-icon"><i class="fa-solid fa-moon"></i></span>
      </button>

      <!-- 桌面版：頁面連結 -->
      <div class="pd-page-links d-none d-lg-flex" role="navigation" aria-label="應用程式頁面">
        <div class="pd-vdivider"></div>
        <a class="pd-action-btn pd-page-link" href="#" data-page="settings" title="設定">
          <i class="fa-solid fa-gear"></i>
          <span class="pd-action-label">設定</span>
        </a>
      </div>

      <!-- 行動版：漢堡選單 -->
      <button class="pd-action-btn pd-menu-btn d-lg-none" id="btnMobileMenu" title="選單" aria-label="開啟選單"
              aria-expanded="false" aria-controls="pdMobileMenu">
        <i class="fa-solid fa-bars" id="mobileMenuIcon"></i>
      </button>
    </div>
  </div>

  <!-- 次列：檢視分頁 -->
  <div class="pd-tabsbar" role="tablist" aria-label="日曆檢視模式">
    <div class="pd-tabs">
      <button class="pd-view-btn" data-view="year" role="tab" aria-selected="false">
        <i class="fa-regular fa-calendar-days"></i>
        <span>年</span>
      </button>
      <button class="pd-view-btn active" data-view="month" role="tab" aria-selected="true">
        <i class="fa-regular fa-calendar"></i>
        <span>月</span>
      </button>
      <button class="pd-view-btn" data-view="week" role="tab" aria-selected="false">
        <i class="fa-solid fa-table-columns"></i>
        <span>週</span>
      </button>
      <button class="pd-view-btn" data-view="day" role="tab" aria-selected="false">
        <i class="fa-regular fa-square"></i>
        <span>日</span>
      </button>
      <button class="pd-view-btn" data-view="agenda" role="tab" aria-selected="false">
        <i class="fa-solid fa-list-ul"></i>
        <span>議程</span>
      </button>
    </div>
    <div class="pd-tabs-right">
      <button class="pd-today-pill" id="btnTodayPill">今天</button>
    </div>
  </div>

  <!-- 行動版下拉選單 -->
  <div class="pd-mobile-menu" id="pdMobileMenu" aria-hidden="true">
    <nav class="pd-mobile-nav">
      <a class="pd-mobile-nav-item pd-page-link" href="#" data-page="settings">
        <span class="pd-mobile-nav-icon"><i class="fa-solid fa-gear"></i></span>
        <span class="pd-mobile-nav-label">設定</span>
        <i class="fa-solid fa-chevron-right pd-mobile-nav-arrow"></i>
      </a>
    </nav>
  </div>

  <!-- 搜尋列（內嵌並向下滑入） -->
  <div id="searchBar" class="pd-search-bar" aria-hidden="true">
    <div class="pd-search-inner">
      <i class="fa-solid fa-magnifying-glass pd-search-ico"></i>
      <input type="text" class="pd-search-input" id="searchInput"
                  placeholder="搜尋事件、標籤或地點…" autocomplete="off"
                  aria-label="搜尋事件" />
                <button class="pd-action-btn pd-search-close" id="btnSearchClose" title="關閉搜尋" aria-label="關閉搜尋">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div id="searchResults" class="pd-search-results" aria-live="polite"></div>
  </div>

</header>

<!-- 主要內容 -->
<main class="pd-main">

  <!-- 日曆檢視 -->
  <div id="calendarView">
    <!-- 年檢視 -->
    <div id="viewYear" class="pd-view d-none">
      <div class="pd-year-grid" id="yearGrid"></div>
    </div>

    <!-- 月檢視 -->
    <div id="viewMonth" class="pd-view">
      <div class="pd-month-grid-header" id="monthDayNames"></div>
      <div class="pd-month-grid" id="monthGrid"></div>
    </div>

    <!-- 週檢視 -->
    <div id="viewWeek" class="pd-view d-none">
      <div class="pd-week-scroll-outer">
        <div class="pd-week-header" id="weekHeader"></div>
        <div class="pd-allday-strip-wrap" id="weekAllDayStrip"></div>
        <div class="pd-week-body-wrap">
          <div class="pd-time-gutter" id="timeGutter"></div>
          <div class="pd-week-body" id="weekBody"></div>
        </div>
      </div>
    </div>

    <!-- 日檢視 -->
    <div id="viewDay" class="pd-view d-none">
      <div class="pd-week-scroll-outer">
        <div class="pd-day-header" id="dayHeader"></div>
        <div class="pd-allday-strip-wrap" id="dayAllDayStrip"></div>
        <div class="pd-week-body-wrap">
          <div class="pd-time-gutter" id="dayTimeGutter"></div>
          <div class="pd-day-body" id="dayBody"></div>
        </div>
      </div>
    </div>

    <!-- 議程檢視 -->
    <div id="viewAgenda" class="pd-view d-none">
      <div class="pd-agenda-list" id="agendaList"></div>
    </div>
  </div>

  <!-- 設定頁面 -->
  <div id="pageView" class="pd-page-view d-none"></div>

</main>

<!-- 快速新增按鈕 -->
<button class="btn pd-fab" id="btnFab" title="新增事件" aria-label="新增事件">
  <i class="fa-solid fa-plus"></i>
</button>

<!-- ====== 對話框 ====== -->

<!-- 事件對話框 -->
<div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content pd-modal-content">
      <div class="modal-header pd-modal-header">
        <h5 class="modal-title" id="eventModalLabel"><i class="fa-solid fa-calendar-plus me-2"></i>新增事件</h5>
        <button type="button" class="btn-close pd-btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
      </div>
      <div class="modal-body">
        <form id="eventForm" novalidate>
          <!-- 標題 -->
          <div class="mb-3">
            <input type="text" class="form-control pd-input pd-input-title" id="evTitle" placeholder="事件標題" required />
          </div>

          <div class="mb-3">
            <label class="form-label pd-label" for="evType">事件類型 <span class="text-danger">*</span></label>
            <select class="form-select pd-input" id="evType" required>
              <option value="" selected disabled>請選擇事件類型</option>
              <option value="important">重要</option>
              <option value="detail">細流</option>
            </select>
          </div>

          <!-- 日期列 -->
          <div class="row g-2 mb-3">
            <div class="col-12">
              <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" id="evAllDay" />
                <label class="form-check-label" for="evAllDay">全天</label>
              </div>
            </div>
            <div class="col-sm-6" id="startDateWrap">
              <label class="form-label pd-label">開始時間</label>
              <input type="datetime-local" class="form-control pd-input" id="evStart" lang="en-GB" required />
            </div>
            <div class="col-sm-6" id="endDateWrap">
              <label class="form-label pd-label">結束時間</label>
              <input type="datetime-local" class="form-control pd-input" id="evEnd" lang="en-GB" required />
            </div>
            <div class="col-sm-6" id="startDateOnlyWrap" style="display:none">
              <label class="form-label pd-label">開始日期</label>
              <input type="date" class="form-control pd-input" id="evStartDate" />
            </div>
            <div class="col-sm-6" id="endDateOnlyWrap" style="display:none">
              <label class="form-label pd-label">結束日期</label>
              <input type="date" class="form-control pd-input" id="evEndDate" />
            </div>
          </div>

          <!-- 描述 -->
          <div class="mb-3">
            <label class="form-label pd-label">描述（Markdown）</label>
            <textarea class="form-control pd-input" id="evDescription" rows="3" placeholder="輸入描述…"></textarea>
          </div>

          <!-- 地點／時區列 -->
          <div class="row g-2 mb-3">
            <div class="col-sm-6">
              <label class="form-label pd-label"><i class="fa-solid fa-location-dot me-1"></i>地點</label>
              <input type="text" class="form-control pd-input" id="evLocation" placeholder="地點或網址" />
            </div>
            <div class="col-sm-6">
              <label class="form-label pd-label"><i class="fa-solid fa-clock me-1"></i>時區</label>
              <select class="form-select pd-input" id="evTimezone"></select>
            </div>
          </div>

          <!-- 顏色／標籤列 -->
          <div class="row g-2 mb-3">
            <div class="col-sm-6">
              <label class="form-label pd-label">顏色</label>
              <div class="pd-color-picker" id="colorPicker"></div>
            </div>
            <div class="col-sm-6">
              <label class="form-label pd-label">標籤</label>
              <input type="text" class="form-control pd-input" id="evLabel" placeholder="例如：工作、私人" />
            </div>
          </div>

          <!-- 重複規則 -->
          <div class="mb-3">
            <label class="form-label pd-label"><i class="fa-solid fa-repeat me-1"></i>重複</label>
            <select class="form-select pd-input" id="evRecurrence">
              <option value="">不重複</option>
              <option value="FREQ=DAILY">每天</option>
              <option value="FREQ=WEEKLY">每週</option>
              <option value="FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR">每個工作日（週一至週五）</option>
              <option value="FREQ=MONTHLY">每月</option>
              <option value="FREQ=YEARLY">每年</option>
              <option value="custom">自訂…</option>
            </select>
            <input type="text" class="form-control pd-input mt-2 d-none" id="evRrule" placeholder="RRULE 規則，例如 FREQ=WEEKLY;BYDAY=MO,WE" />
          </div>

          <!-- 提醒 -->
          <div class="mb-3">
            <label class="form-label pd-label"><i class="fa-solid fa-bell me-1"></i>提醒</label>
            <div id="reminderList" class="d-flex flex-wrap gap-2 mb-2"></div>
            <div class="input-group input-group-sm" style="max-width:260px">
              <input type="number" class="form-control pd-input" id="reminderMinutes" placeholder="提前幾分鐘" min="1" />
              <button type="button" class="btn pd-btn-ghost" id="btnAddReminder"><i class="fa-solid fa-plus"></i>新增</button>
            </div>
          </div>

          <!-- 參與者 -->
          <div class="mb-3">
            <label class="form-label pd-label"><i class="fa-solid fa-users me-1"></i>參與者</label>
            <div id="attendeeList" class="d-flex flex-wrap gap-2 mb-2"></div>
            <div class="input-group input-group-sm" style="max-width:320px">
              <input type="email" class="form-control pd-input" id="attendeeInput" placeholder="電子郵件地址" />
              <button type="button" class="btn pd-btn-ghost" id="btnAddAttendee"><i class="fa-solid fa-plus"></i>新增</button>
            </div>
          </div>

          <!-- 附件 -->
          <div class="mb-2">
            <label class="form-label pd-label"><i class="fa-solid fa-paperclip me-1"></i>附件（網址）</label>
            <div id="attachmentList" class="d-flex flex-wrap gap-2 mb-2"></div>
            <div class="input-group input-group-sm" style="max-width:400px">
              <input type="url" class="form-control pd-input" id="attachmentInput" placeholder="https://…" />
              <button type="button" class="btn pd-btn-ghost" id="btnAddAttachment"><i class="fa-solid fa-plus"></i>新增</button>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer pd-modal-footer">
        <div class="me-auto d-flex gap-2">
          <button type="button" class="btn pd-btn-ghost d-none" id="btnExportEvent" title="匯出為 .md"><i class="fa-solid fa-file-export me-1"></i>匯出 .md</button>
          <button type="button" class="btn pd-btn-danger d-none" id="btnDeleteEvent" title="按住 Shift 點擊可直接刪除"><i class="fa-solid fa-trash me-1"></i>刪除</button>
        </div>
        <button type="button" class="btn pd-btn-ghost" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn pd-btn-primary" id="btnSaveEvent" aria-busy="false">
          <span class="spinner-border spinner-border-sm me-1 d-none" aria-hidden="true"></span>
          <i class="fa-solid fa-floppy-disk me-1"></i>儲存
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 事件詳細資料快顯視窗 -->
<div id="eventPopover" class="pd-event-popover d-none">
  <div class="pd-popover-header">
    <div class="pd-popover-color-dot" id="popColor"></div>
    <span class="pd-popover-title" id="popTitle"></span>
    <div class="ms-auto d-flex gap-1">
      <button class="btn btn-sm pd-btn-icon" id="popEdit" title="編輯" aria-label="編輯"><i class="fa-solid fa-pen"></i></button>
      <button class="btn btn-sm pd-btn-icon" id="popDelete" title="按住 Shift 點擊可直接刪除" aria-label="刪除"><i class="fa-solid fa-trash"></i></button>
      <button class="btn btn-sm pd-btn-icon" id="popClose" title="關閉" aria-label="關閉"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>
  <div class="pd-popover-body" id="popBody"></div>
</div>

<!-- 刪除確認 -->
<dialog class="pd-delete-dialog" id="deleteConfirm" aria-labelledby="deleteConfirmTitle" aria-describedby="deleteConfirmMessage">
  <div class="pd-delete-confirm-content">
    <h2 id="deleteConfirmTitle"><i class="fa-solid fa-triangle-exclamation me-2"></i>刪除事件</h2>
    <p id="deleteConfirmMessage">確定要刪除此事件嗎？此操作無法復原。</p>
    <div class="pd-delete-confirm-actions">
      <button type="button" class="btn pd-btn-ghost" id="cancelDeleteEvent">取消</button>
      <button type="button" class="btn pd-btn-danger" id="confirmDeleteEvent"><i class="fa-solid fa-trash me-1"></i>刪除</button>
    </div>
  </div>
</dialog>

<!-- 一般提示 -->
<dialog class="pd-delete-dialog" id="appAlert" aria-labelledby="appAlertTitle" aria-describedby="appAlertMessage">
  <div class="pd-delete-confirm-content">
    <h2 id="appAlertTitle">提示</h2>
    <p id="appAlertMessage"></p>
    <div class="pd-delete-confirm-actions">
      <button type="button" class="btn pd-btn-primary" id="dismissAppAlert">知道了</button>
    </div>
  </div>
</dialog>

<!-- 指令碼 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/recurrence.js"></script>
<script src="js/ics.js"></script>
<script src="js/events.js"></script>
<script src="js/calendar.js"></script>
<script src="js/app.js"></script>
</body>
</html>
